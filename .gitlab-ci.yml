# ------------------------------------------------------------------------------
# Modulo 7 — Report e analytics.
# ------------------------------------------------------------------------------
jobTest_report_analytics:
  extends: .test_job_base
  needs:
    - jobTest_fidelity
  script:
    - >
      pytest tests/7_report_e_analytics --browser chromium
      --screenshot=only-on-failure --video=retain-on-failure --tracing=retain-on-failure
      --junitxml=reports/junit/results_report_analytics.xml
