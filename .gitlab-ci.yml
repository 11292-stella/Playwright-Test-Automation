      --alluredir=reports/allure-results || true
  artifacts:
    reports:
      junit: reports/junit/results_controllo_gestione.xml

# ==============================================================================
# JOB — TEST SINGOLO SPEC (MANUALE)
# Stessa logica di jobTest_singolo_spec nella pipeline Cypress: gira solo se
# lanciato a mano dalla UI, per verificare in isolamento un singolo file senza
# aspettare tutta la catena. $[[ inputs.spec_path ]] viene sostituito PRIMA
# che la pipeline parta (interpolazione degli input dichiarati in cima al file).
# needs: [] — esce dall'ordinamento sequenziale degli stage: appena la cache
# pip e' disponibile puo' partire subito, senza aspettare smoke.
# ==============================================================================
jobTest_singolo_spec:
  stage: test
  tags:
    - docker
  when: manual
  needs: []
  dependencies: []
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/pip/
    policy: pull
  script:
    - echo "Eseguo solo lo spec => $[[ inputs.spec_path ]]"
    - >
      pytest "$[[ inputs.spec_path ]]" --browser chromium
      --screenshot=only-on-failure --video=retain-on-failure --tracing=retain-on-failure
      --junitxml=reports/junit/results_singolo_spec.xml
      --html=reports/html/results_singolo_spec.html --self-contained-html
      --alluredir=reports/allure-results
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: reports/junit/results_singolo_spec.xml
    paths:
      - reports/
      - test-results/

# ==============================================================================
# JOB — COMMENTO AUTOMATICO SULLA MERGE REQUEST
# Identico, per struttura e motivazione, a job_commento_mr della pipeline
# Cypress: gira solo nel contesto di una MR, dopo l'ultimo job della catena di
# test, e lascia un commento che rimanda alla tab Tests/agli artifact.
# GITLAB_BOT_TOKEN va creato come CI/CD Variable protetta (Project Access
# Token con permesso di scrittura sulle note delle MR), passato nell'header
# PRIVATE-TOKEN (CI_JOB_TOKEN da solo non basta per questa chiamata API).
# ==============================================================================
job_commento_mr:
  stage: test
  tags:
    - docker
  image: alpine:latest
  variables:
    GIT_STRATEGY: none
  needs:
    - jobTest_controllo_gestione
  rules:
    - if: '$CI_MERGE_REQUEST_IID'
  script:
    - apk add --no-cache curl
    - >
      curl --request POST
      --header "PRIVATE-TOKEN: $GITLAB_BOT_TOKEN"
      --form "body=Pipeline Playwright terminata. Controlla la tab Tests e gli artifact dei job jobTest_* per il dettaglio dei fallimenti per modulo."
      "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes"