      junit: reports/junit/results_report_analytics.xml

# ------------------------------------------------------------------------------
# Modulo 8 — Controllo di gestione (food cost, sprechi, menu engineering).
# Ultimo della catena.
# ------------------------------------------------------------------------------
jobTest_controllo_gestione:
  extends: .test_job_base
  needs:
    - jobTest_report_analytics
  script:
    - >
      pytest tests/8_controllo_gestione --browser chromium
      --screenshot=only-on-failure --video=retain-on-failure --tracing=retain-on-failure
      --junitxml=reports/junit/results_controllo_gestione.xml
