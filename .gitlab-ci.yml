# ------------------------------------------------------------------------------
# Modulo 6 — Fidelity (carte, coupon, campagne, premi, livelli/tier).
# ------------------------------------------------------------------------------
jobTest_fidelity:
  extends: .test_job_base
  needs:
    - jobTest_delivery
  script:
    - >
      pytest tests/6_fidelity --browser chromium
      --screenshot=only-on-failure --video=retain-on-failure --tracing=retain-on-failure
      --junitxml=reports/junit/results_fidelity.xml
